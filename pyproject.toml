[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sctrl"
version = "0.1.0"
description = "SCTRL - Linux laptop monitoring and control utility for supported Acer Nitro and Predator laptops. Unofficial, not affiliated with or endorsed by Acer."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors = [
    {name = "SCTRL Contributors"},
]
keywords = ["linux", "laptop", "fan-control", "hardware", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "dbus-next>=0.2.3",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "hypothesis>=6.90.0",
]

[project.scripts]
sctrld = "daemon.main:main"
sctrl-gui = "gui.main:main"

[project.urls]
Homepage = "https://github.com/jarusuraj/SCTRL"
Repository = "https://github.com/jarusuraj/SCTRL"
Issues = "https://github.com/jarusuraj/SCTRL/issues"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["sctrl*", "daemon*", "gui*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security tests",
    "slow: Slow tests",
]
