<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root (sctrld) can own the service -->
  <policy user="root">
    <allow own="io.github.sctrl.sctrl"/>
    <allow send_destination="io.github.sctrl.sctrl"/>
    <allow receive_sender="io.github.sctrl.sctrl"/>
  </policy>

  <!-- Any local user can query and interact via D-Bus -->
  <policy context="default">
    <allow send_destination="io.github.sctrl.sctrl"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.sctrl.sctrl"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.github.sctrl.sctrl"
           send_interface="io.github.sctrl.sctrl.Control"/>
    <allow receive_sender="io.github.sctrl.sctrl"/>
  </policy>
</busconfig>
