# Acer Predator Helios Neo 16 PHN16-72
# Verified against docs/hw-dump.txt

[identity]
product_names = ["PHN16-72"]
vendor = "Acer"
board_names = ["Covini_PH16-72"]

[drivers]
primary = "acer-wmi"
optional = ["linuwu-sense"]

[fans]
count = 2
max_speed_percent = 100
modes = ["auto", "max", "custom"]

[keyboard]
zones = 4
effects = ["static", "breathing", "off"]

[battery]
charge_limit_supported = true
charge_limit_range = [50, 100]

[thermal]
cpu_warn_c = 90
cpu_critical_c = 100
gpu_warn_c = 85
gpu_critical_c = 95

[profiles]
[profiles.mapping]
quiet = "low-power"
balanced = "balanced"
performance = "performance"
turbo = "turbo"

[quirks]
# Exact node names verified from docs/hw-dump.txt
linuwu_base_dir = "/sys/devices/platform/linuwu-sense"
linuwu_fan_mode_node = "fan_mode"
linuwu_cpu_speed_node = "cpu_fan_speed"
linuwu_gpu_speed_node = "gpu_fan_speed"
linuwu_profile_node = "platform_profile"

[verification]
tester = "unverified"
date = "2024-06-15"
kernel_version = "6.8.0-generic"
bios_version = "V1.06"
bios_family = "V1."
features_verified = []
features_unverified = [
    "cpu_temp",
    "gpu_temp",
    "cpu_fan_rpm",
    "gpu_fan_rpm",
    "fan_mode",
    "fan_curve",
    "performance_profile",
    "charge_limit",
    "keyboard_brightness",
    "keyboard_rgb",
    "keyboard_effect",
]
notes = "Hardware identity and exact nodes verified from docs/hw-dump.txt. Features remain unverified until physical confirmation."
